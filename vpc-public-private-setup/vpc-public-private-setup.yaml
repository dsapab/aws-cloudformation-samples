Description: "VPC with public and (optionally) private subnets. NetworkMode selects one of three layouts: PublicOnly, PublicPrivate (managed NAT gateway), or PublicPrivateCustomRouting (a self-healing EC2 Spot gateway that routes all private-subnet egress - a VPN client can be layered on top)."
AWSTemplateFormatVersion: "2010-09-09"
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network layout ...
        Parameters:
          - NetworkMode
          - ResourcesPrefixName
      - Label:
          default: Flow logs (optional) ...
        Parameters:
          - EnableFlowLogs
          - TrafficType
          - RetentionInDays
      - Label:
          default: Custom routing gateway (NetworkMode=PublicPrivateCustomRouting) ...
        Parameters:
          - GatewayInstanceType
          - GatewayCapacityMode
Parameters:
  ResourcesPrefixName:
    Type: String
    Default: auto-networking
    Description: Prefix name for all the auto generated resources
  RetentionInDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: Specifies the number of days you want to retain log events.
  TrafficType:
    Type: String
    Default: REJECT
    AllowedValues:
      - ACCEPT
      - REJECT
      - ALL
    Description: The type of traffic to log.
  EnableFlowLogs:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable VPC Flow Logs
  NetworkMode:
    Type: String
    Default: PublicOnly
    AllowedValues:
      - PublicOnly
      - PublicPrivate
      - PublicPrivateCustomRouting
    Description: |-
      Network layout to deploy.
      - PublicOnly: public subnets, IGW, public route table only.
      - PublicPrivate: also private subnets behind a managed NAT gateway.
      - PublicPrivateCustomRouting: private subnets behind a self-healing EC2
        Spot gateway that re-points the private route at itself and NATs egress
        (a VPN client can be layered on top). See the custom-gateway parameters.
  GatewayInstanceType:
    Type: String
    Default: t3.small
    Description: |-
      Instance type for the custom routing gateway. Used only when
      NetworkMode=PublicPrivateCustomRouting. Also the first entry in the Auto
      Scaling group's instance-type overrides (alongside a couple of small
      alternates) so the Spot capacity strategy has choices.
  GatewayCapacityMode:
    Type: String
    Default: SpotLowestPrice
    AllowedValues:
      - SpotLowestPrice
      - SpotCapacityOptimized
      - OnDemand
    Description: |-
      Purchase model for the custom routing gateway. Used only when
      NetworkMode=PublicPrivateCustomRouting.
      - SpotLowestPrice: 100% Spot, cheapest AZ/type (most interruptions).
      - SpotCapacityOptimized: 100% Spot, price-capacity-optimized (fewer
        interruptions, better availability).
      - OnDemand: no Spot; the single instance is On-Demand (best availability,
        highest cost).
Mappings:
  CapacityModeMap:
    SpotLowestPrice:
      OnDemandPercentage: 0
      SpotStrategy: lowest-price
    SpotCapacityOptimized:
      OnDemandPercentage: 0
      SpotStrategy: price-capacity-optimized
    OnDemand:
      OnDemandPercentage: 100
      SpotStrategy: lowest-price
Conditions:
  HasPrivateSubnets:
    Fn::Not:
      - Fn::Equals:
          - Ref: NetworkMode
          - PublicOnly
  UseNatGateway:
    Fn::Equals:
      - Ref: NetworkMode
      - PublicPrivate
  UseCustomGateway:
    Fn::Equals:
      - Ref: NetworkMode
      - PublicPrivateCustomRouting
  EnableFlowLogsCondition:
    Fn::Equals:
      - Ref: EnableFlowLogs
      - "true"
Resources:
  PubPrivateVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-vpc
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-public-subnet-A
      VpcId:
        Ref: PubPrivateVPC
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-public-subnet-B
      VpcId:
        Ref: PubPrivateVPC
  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: ""
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-public-subnet-C
      VpcId:
        Ref: PubPrivateVPC
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-igw
  GatewayToInternet:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId:
        Ref: InternetGateway
      VpcId:
        Ref: PubPrivateVPC
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-PublicRouteTable
      VpcId:
        Ref: PubPrivateVPC
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway
      RouteTableId:
        Ref: PublicRouteTable
    DependsOn:
      - GatewayToInternet
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet1
  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet2
  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      SubnetId:
        Ref: PublicSubnet3
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-PrivateRouteTable
      VpcId:
        Ref: PubPrivateVPC
    Condition: HasPrivateSubnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-private-subnet-A
      VpcId:
        Ref: PubPrivateVPC
    Condition: HasPrivateSubnets
  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet1
    Condition: HasPrivateSubnets
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
      CidrBlock: 10.0.5.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-private-subnet-B
      VpcId:
        Ref: PubPrivateVPC
    Condition: HasPrivateSubnets
  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet2
    Condition: HasPrivateSubnets
  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 2
          - Fn::GetAZs: ""
      CidrBlock: 10.0.6.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-private-subnet-C
      VpcId:
        Ref: PubPrivateVPC
    Condition: HasPrivateSubnets
  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: PrivateRouteTable
      SubnetId:
        Ref: PrivateSubnet3
    Condition: HasPrivateSubnets
  NatPublicIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
    DependsOn:
      - PubPrivateVPC
    Condition: UseNatGateway
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt:
          - NatPublicIP
          - AllocationId
      SubnetId:
        Ref: PublicSubnet1
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-NatGateway
    Condition: UseNatGateway
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId:
        Ref: NatGateway
      RouteTableId:
        Ref: PrivateRouteTable
    Condition: UseNatGateway
  CustomGwVpnBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-custom-gw-vpn
    Condition: UseCustomGateway
  CustomGwSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Custom routing gateway - allow all traffic from within the VPC
      SecurityGroupIngress:
        - CidrIp: 10.0.0.0/16
          IpProtocol: "-1"
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${ResourcesPrefixName}-custom-gw-sg
      VpcId:
        Ref: PubPrivateVPC
    Condition: UseCustomGateway
  CustomGwInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Path: /
      Policies:
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageDefaultRoute
                Effect: Allow
                Action:
                  - ec2:CreateRoute
                  - ec2:ReplaceRoute
                Resource:
                  Fn::Sub:
                    - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:route-table/${rt}
                    - rt:
                        Ref: PrivateRouteTable
              - Sid: DisableSourceDestCheck
                Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Name:
                      Fn::Sub: ${ResourcesPrefixName}-custom-gw
              - Sid: DescribeRouteTables
                Effect: Allow
                Action: ec2:DescribeRouteTables
                Resource: "*"
              - Sid: WatchdogHealth
                Effect: Allow
                Action: autoscaling:SetInstanceHealth
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-custom-gw
              - Sid: VpnFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - Fn::GetAtt:
                      - CustomGwVpnBucket
                      - Arn
                  - Fn::Sub:
                      - ${arn}/*
                      - arn:
                          Fn::GetAtt:
                            - CustomGwVpnBucket
                            - Arn
          PolicyName: custom-gw
    Condition: UseCustomGateway
  CustomGwInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - Ref: CustomGwInstanceRole
    Condition: UseCustomGateway
  CustomGwLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        IamInstanceProfile:
          Name:
            Ref: CustomGwInstanceProfile
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
        InstanceType:
          Ref: GatewayInstanceType
        MetadataOptions:
          HttpTokens: required
        SecurityGroupIds:
          - Ref: CustomGwSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value:
                  Fn::Sub: ${ResourcesPrefixName}-custom-gw
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash -xe

                # Fail the stack fast (don't wait for the CreationPolicy timeout) if
                # any command below errors.
                trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackId} --resource ${AsgLogicalId} --region ${AWS::Region}' ERR

                # --- Identity (IMDSv2) ---
                TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
                          -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
                IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
                          http://169.254.169.254/latest/meta-data/instance-id)

                # --- Prerequisites ---
                # Amazon Linux 2023 ships nftables, not the iptables command, so the
                # MASQUERADE rule below needs the iptables package (nft-backed).
                dnf install -y iptables

                # --- Act as a router ---
                # 1. Enable IPv4 forwarding (persisted so it survives reboots).
                echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/99-custom-gw.conf
                sysctl -p /etc/sysctl.d/99-custom-gw.conf

                # 2. Disable this instance's source/dest check so it can forward
                #    packets not addressed to itself.
                aws ec2 modify-instance-attribute --region ${AWS::Region} \
                  --instance-id "$IID" --no-source-dest-check

                # 3. Point the private route table's default route at this instance.
                #    ReplaceRoute updates the (possibly blackholed) route left by a
                #    previous instance; CreateRoute handles the very first boot.
                aws ec2 replace-route --region ${AWS::Region} \
                  --route-table-id ${PrivateRouteTable} \
                  --destination-cidr-block 0.0.0.0/0 --instance-id "$IID" 2>/dev/null \
                || aws ec2 create-route --region ${AWS::Region} \
                  --route-table-id ${PrivateRouteTable} \
                  --destination-cidr-block 0.0.0.0/0 --instance-id "$IID"

                # 4. NAT (masquerade) private-subnet traffic out the primary
                #    interface. This gives working egress immediately, before any
                #    VPN is wired. Rules are re-applied on each boot (ephemeral box).
                PRIMARY_IF=$(ip route show default | awk '{print $5; exit}')
                iptables -t nat -A POSTROUTING -s 10.0.0.0/16 -o "$PRIMARY_IF" -j MASQUERADE

                # --- VPN client files ---
                # Pull whatever is in the stack-created bucket into /etc/vpn. The
                # bucket starts empty (files are uploaded later), so this is a no-op
                # until then. Best-effort so an empty bucket never blocks boot.
                mkdir -p /etc/vpn
                aws s3 cp --recursive "s3://${CustomGwVpnBucket}/" /etc/vpn/ || true

                ############################################################
                # TODO: VPN connect (left as a scaffold hook).
                #   - Install the VPN client (e.g. `dnf install -y vpnc`).
                #   - Connect the tunnel using the files in /etc/vpn.
                #   - Re-point the MASQUERADE above from "$PRIMARY_IF" to tun0 so
                #     private egress leaves via the VPN instead of the public subnet.
                #   - Extend the watchdog probe below to also require the tunnel up
                #     (`ip link show tun0`).
                ############################################################

                # --- Health watchdog ---
                # A booted instance whose route or egress is broken would otherwise
                # sit in service black-holing traffic. This timer marks the instance
                # unhealthy so the ASG replaces it.
                cat > /usr/local/sbin/gw-healthcheck.sh <<'GWHC'
                #!/bin/bash
                TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
                          -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
                IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
                          http://169.254.169.254/latest/meta-data/instance-id)
                OK=1
                # The private default route must still target THIS instance.
                TARGET=$(aws ec2 describe-route-tables --region ${AWS::Region} \
                  --route-table-ids ${PrivateRouteTable} \
                  --query "RouteTables[0].Routes[?DestinationCidrBlock=='0.0.0.0/0'].InstanceId | [0]" \
                  --output text 2>/dev/null)
                [ "$TARGET" = "$IID" ] || OK=0
                # General egress must work (once VPN is wired, also require tun0 up).
                curl -s --max-time 5 https://checkip.amazonaws.com >/dev/null 2>&1 || OK=0
                if [ "$OK" -ne 1 ]; then
                  aws autoscaling set-instance-health --region ${AWS::Region} \
                    --instance-id "$IID" --health-status Unhealthy
                fi
                GWHC
                chmod 0755 /usr/local/sbin/gw-healthcheck.sh

                cat > /etc/systemd/system/gw-healthcheck.service <<'UNIT'
                [Unit]
                Description=Custom gateway route/egress health watchdog
                [Service]
                Type=oneshot
                ExecStart=/usr/local/sbin/gw-healthcheck.sh
                UNIT

                cat > /etc/systemd/system/gw-healthcheck.timer <<'UNIT'
                [Unit]
                Description=Run the custom gateway health watchdog periodically
                [Timer]
                OnBootSec=2min
                OnUnitActiveSec=1min
                [Install]
                WantedBy=timers.target
                UNIT

                systemctl daemon-reload
                systemctl enable --now gw-healthcheck.timer

                # Signal success to the CreationPolicy.
                /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackId} --resource ${AsgLogicalId} --region ${AWS::Region}
              - AsgLogicalId: CustomGwASG
                PrivateRouteTable:
                  Ref: PrivateRouteTable
                CustomGwVpnBucket:
                  Ref: CustomGwVpnBucket
    Condition: UseCustomGateway
  CustomGwASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName:
        Fn::Sub: ${AWS::StackName}-custom-gw
      DesiredCapacity: "1"
      MaxSize: "1"
      MinSize: "1"
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: 0
          OnDemandPercentageAboveBaseCapacity:
            Fn::FindInMap:
              - CapacityModeMap
              - Ref: GatewayCapacityMode
              - OnDemandPercentage
          SpotAllocationStrategy:
            Fn::FindInMap:
              - CapacityModeMap
              - Ref: GatewayCapacityMode
              - SpotStrategy
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId:
              Ref: CustomGwLaunchTemplate
            Version:
              Fn::GetAtt:
                - CustomGwLaunchTemplate
                - LatestVersionNumber
          Overrides:
            - InstanceType:
                Ref: GatewayInstanceType
            - InstanceType: t3a.small
            - InstanceType: t2.small
      Tags:
        - Key: Name
          PropagateAtLaunch: true
          Value:
            Fn::Sub: ${ResourcesPrefixName}-custom-gw
      VPCZoneIdentifier:
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
        - Ref: PublicSubnet3
    CreationPolicy:
      AutoScalingCreationPolicy:
        MinSuccessfulInstancesPercent: 100
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: 0
        MinSuccessfulInstancesPercent: 100
        PauseTime: PT15M
        WaitOnResourceSignals: true
    Condition: UseCustomGateway
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays:
        Ref: RetentionInDays
    Condition: EnableFlowLogsCondition
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource:
                  Fn::GetAtt:
                    - LogGroup
                    - Arn
          PolicyName: flowlogs-policy
    Condition: EnableFlowLogsCondition
  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn:
        Fn::GetAtt:
          - Role
          - Arn
      LogGroupName:
        Ref: LogGroup
      ResourceId:
        Ref: PubPrivateVPC
      ResourceType: VPC
      TrafficType:
        Ref: TrafficType
    Condition: EnableFlowLogsCondition
Outputs:
  PubPrivateVPCID:
    Description: VPC ID
    Value:
      Ref: PubPrivateVPC
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-VPCId
  PrivateSubnet1ID:
    Description: Private Subnet A ID
    Value:
      Ref: PrivateSubnet1
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-privateSubnetID1
    Condition: HasPrivateSubnets
  PrivateSubnet2ID:
    Description: Private Subnet B ID
    Value:
      Ref: PrivateSubnet2
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-privateSubnetID2
    Condition: HasPrivateSubnets
  PrivateSubnet3ID:
    Description: Private Subnet B ID
    Value:
      Ref: PrivateSubnet3
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-privateSubnetID3
    Condition: HasPrivateSubnets
  PublicSubnet1ID:
    Description: Public Subnet A ID
    Value:
      Ref: PublicSubnet1
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-publicSubnetID1
  PublicSubnet2ID:
    Description: Public Subnet B ID
    Value:
      Ref: PublicSubnet2
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-publicSubnetID2
  PublicSubnet3ID:
    Description: Public Subnet B ID
    Value:
      Ref: PublicSubnet3
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-publicSubnetID3
  LogGroupARN:
    Description: The name of the CloudWatch Logs log group where the flow logs will be published.
    Value:
      Fn::GetAtt:
        - LogGroup
        - Arn
    Condition: EnableFlowLogsCondition
  CustomGatewayASGName:
    Description: Auto Scaling group name of the custom routing gateway.
    Value:
      Ref: CustomGwASG
    Condition: UseCustomGateway
  CustomGatewayVpnBucket:
    Description: Bucket the gateway reads VPN client files from. Upload your config here, then wire the TODO block in the gateway UserData.
    Value:
      Ref: CustomGwVpnBucket
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-customGwVpnBucket
    Condition: UseCustomGateway
  PrivateRouteTableId:
    Description: Private route table id. Its 0.0.0.0/0 route is managed by the custom gateway instance at boot; handy for confirming the route target.
    Value:
      Ref: PrivateRouteTable
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-privateRouteTableId
    Condition: UseCustomGateway

